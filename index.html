function stat(t,c){const e=$('#sync');if(e){e.textContent=t;e.style.color=c||''}}
function api(act,payload){if(DEMO)return demoApi(act,payload);return new Promise((ok,no)=>{
if(!/^https:/.test(GAS_URL))return no(new Error('URL Apps Script belum diisi'));
fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({act,token:TOK,payload})}).then(r=>r.json()).then(r=>{if(r&&r.auth&&act!=='login')logout(r.error);ok(r)},no)})}
const lerr=t=>{$('#l_err').textContent=t||''};
function lMode(m){LM=m;$('#sg1').classList.toggle('on',m===1);$('#sg2').classList.toggle('on',m===2);$('#lp1').style.display=m===1?'':'none';$('#lp2').style.display=m===2?'':'none';lerr('')}
function showLand(m){document.querySelectorAll('.lgi').forEach(i=>i.src=LOGO);$('#land').style.display='';lMode(typeof m==='string'&&m?LM:2);lerr(m||'');$('#lb').disabled=false;$('#lb').textContent='Masuk';renderRuang()}
/* ---- Nama ruangan tersimpan (per perangkat) ---- */
const RLK='hd_ruang_list',RKEY="onkeydown=\"if(event.key==='Enter')doLogin()\"";
const RUANG_STD=['IGD','GICU','ICCU','PICU','HCCU dan Stroke Unit','ALI BIN ABI THOLIB Lt.3','ALI BIN ABI THOLIB Lt.4','ABDURAHMAN BIN AUF Lt. 1','ABDURAHMAN BIN AUF Lt. 2','HASAN BIN ALI','HUSAIN BIN ALI','KHALID BIN WALID','SAID BIN ZAID','SALMAN AL FARIZI','SITI KHADIJAH','UMAR BIN KHATTAB 1','UMAR BIN KHATTAB 2','UMAR BIN KHATTAB 3','USTMAN BIN AFFAN 1','USTMAN BIN AFFAN 2','USTMAN BIN AFFAN 3'];
const ruNorm=x=>String(x||'').replace(/\s+/g,' ').trim(),ruKey=x=>ruNorm(x).toLowerCase();
function ruSaved(){let a=[];try{a=JSON.parse(localStorage.getItem(RLK)||'[]');if(!Array.isArray(a))a=[]}catch(e){a=[]}return a}
function ruList(){const seen=new Set(),out=[];[...RUANG_STD,...ruSaved()].forEach(x=>{x=ruNorm(x);const k=x.toLowerCase();if(x&&!seen.has(k)){seen.add(k);out.push(x)}});return out.sort((p,q)=>p.localeCompare(q,'id',{numeric:true,sensitivity:'base'}))}
function ruCanon(n){n=ruNorm(n);const k=n.toLowerCase(),f=ruList().find(x=>x.toLowerCase()===k);return f||n}
function addRuang(n){n=ruCanon(n);if(!n)return;try{localStorage.setItem('hd_ruang',n);if(RUANG_STD.some(x=>ruKey(x)===ruKey(n)))return;const a=ruSaved().filter(x=>ruKey(x)!==ruKey(n));a.unshift(n);localStorage.setItem(RLK,JSON.stringify(a.slice(0,30)))}catch(e){}}
function getRuang(){return ruCanon(($('#l_ruang')||{}).value||'')}
/* kotak ketik + saran + panah ▾ */
function ruShow(all){const l=$('#l_ruang_dd'),i=$('#l_ruang');if(!l||!i)return;const q=ruKey(i.value),a=ruList();
let r=all||!q?a:[...a.filter(x=>ruKey(x).startsWith(q)),...a.filter(x=>!ruKey(x).startsWith(q)&&ruKey(x).includes(q))];
l.innerHTML=r.length?r.map(x=>`<div onmousedown="event.preventDefault()" onclick="ruPick(this.dataset.v)" data-v="${esc(x)}">${esc(x)}</div>`).join(''):`<div class="mut" style="cursor:default">Tidak ada saran. Nama baru akan disimpan otomatis saat masuk.</div>`;
l.style.display=''}
function ruHide(){const l=$('#l_ruang_dd');if(l)l.style.display='none'}
function ruPick(v){const i=$('#l_ruang');i.value=v;ruHide();i.focus()}
function ruToggle(){const l=$('#l_ruang_dd');if(l.style.display==='none')ruShow(true);else ruHide()}
function renderRuang(){const w=$('#l_ruang_w');if(!w)return;let last='';try{last=localStorage.getItem('hd_ruang')||''}catch(e){}
w.innerHTML=`<div class="cbl">Nama ruangan</div><div class="cb"><input id="l_ruang" placeholder="Ketik atau pilih ruangan…" autocomplete="off" value="${esc(last)}" oninput="ruShow(false)" onfocus="this.select()" onblur="setTimeout(ruHide,150)" onkeydown="if(event.key==='Enter'){ruHide();doLogin()}else if(event.key==='Escape')ruHide()"><button type="button" class="cbt" aria-label="Tampilkan daftar ruangan" onmousedown="event.preventDefault()" onclick="ruToggle()">▾</button><div id="l_ruang_dd" class="cbd" style="display:none"></div></div><small>Ketik huruf awal untuk melihat saran, atau ketuk tanda ▾ untuk memilih dari daftar (urut abjad). Ruangan yang belum ada di daftar tetap bisa diketik dan otomatis tersimpan.</small>`}
async function doLogin(){const pay=LM===1?{mode:'petugas',pin:$('#l_pin').value.trim()}:{mode:'ruangan',ruang:getRuang(),kode:$('#l_kode').value.trim()};
if(LM===1&&!pay.pin)return lerr('Masukkan PIN petugas');if(LM===2&&!pay.ruang)return lerr('Isi nama ruangan');
$('#lb').disabled=true;$('#lb').textContent='Memproses…';lerr('');
try{const r=await api('login',pay);if(!r.ok){if(r.needKode)$('#l_kode_w').style.display='';$('#lb').disabled=false;$('#lb').textContent='Masuk';return lerr(r.error)}
TOK=r.token;ME=r.user;try{localStorage.setItem('hd_tok',TOK);localStorage.setItem('hd_me',JSON.stringify(ME));if(LM===2)addRuang(pay.ruang)}catch(e){}
$('#l_pin').value='';boot()}
catch(e){$('#lb').disabled=false;$('#lb').textContent='Masuk';lerr('Tidak dapat terhubung: '+(e.message||'periksa internet'))}}
function logout(m){TOK='';ME=null;SL=false;try{localStorage.removeItem('hd_tok');localStorage.removeItem('hd_me');localStorage.removeItem(KEY)}catch(e){}S={master:[],jadwal:{},seeded:false};PEND=[];FOTO=[];seen=null;OLD=null;applyRole();showLand(typeof m==='string'?m:'')}
function applyRole(){const r=ME&&ME.role==='ruangan',h=!ME||r;[$('#stkw'),$('#main')].forEach(e=>e.style.display=h?'none':'');$('#rg').style.display=r?'':'none';$('#land').style.display=ME?'none':''}
async function boot(){conflict=false;document.querySelectorAll('.lgi').forEach(i=>i.src=LOGO);applyRole();
if(!TOK||!ME)return showLand();
if(ME.role==='ruangan'){renderRg();return}
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
render();stat('Memuat dari Drive…');
try{const r=await api('load');if(!r.ok){if(!r.auth)stat('Gagal memuat: '+(r.error||''),'#c00');return}
S={master:[],jadwal:{},...r.data};SL=true;render();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}stat('Tersimpan di Drive ✓');pendRefresh(true)}
catch(e){stat('Offline, memakai data lokal ('+(e.message||'gagal')+') — ketuk untuk coba lagi','#c00')}}
function save(){for(const k in S.jadwal)if(!S.jadwal[k].items.length&&!S.jadwal[k].rilis&&!hasStf(S.jadwal[k]))delete S.jadwal[k];try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}dirty=true;clearTimeout(tm);tm=setTimeout(push,700);stat('Menyimpan…')}
async function push(){if(conflict||!TOK||!ME||ME.role!=='petugas')return;if(saving){tm=setTimeout(push,700);return}saving=true;dirty=false;
try{const r=await api('save',JSON.stringify(S));
if(r.ok){S._rev=r.rev;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}stat(dirty?'Menyimpan…':'Tersimpan di Drive ✓');pSync()}
else if(r.conflict){conflict=true;stat('⚠ Data diubah di perangkat lain. Ketuk di sini untuk muat ulang','#c00')}
else stat('Gagal menyimpan: '+(r.error||''),'#c00')}
catch(e){stat('Gagal menyimpan (offline?). Ketuk untuk coba lagi','#c00')}
saving=false;if(dirty&&!conflict)push()}
function backup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jadwal-hd-'+ymd(new Date())+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.master||!d.jadwal)throw 0;const rev=S._rev;S=d;S._rev=rev;save();render();toast('Data dipulihkan')}catch(e){toast('File tidak valid')}};r.readAsText(f)}
function seed(){const A=['Rajal','Ranap','IGD'],K=['','','HBsAg','','HCV','','ISO TB','','','','',''];
for(let i=0;i<14;i++)S.master.push({id:uid(),nama:'Pasien Contoh '+pad(i+1),rm:'00-0000'+pad(i+1),asal:A[i%4==3?2:i%5==4?1:0],hari:i%2?[2,4,6]:[1,3,5],shift:i%4<2?'Pagi':'Siang',lantai:i%3==0?2:1,ket:K[i%12],aktif:true});
S.seeded=true;save()}
const J=d=>S.jadwal[d]||(S.jadwal[d]={items:[],rilis:null});
const act=d=>(S.jadwal[d]?.items||[]).filter(i=>i.status!=='Batal');
const hasStf=j=>Object.values(j.staff||{}).some(o=>o.p1||o.p2||o.m1||o.m2);
const stf=(d,sh)=>{const j=J(d);j.staff=j.staff||{};return j.staff[sh]||(j.staff[sh]={p1:0,p2:0,m1:0,m2:0})};

const jml=(sh,l,ex)=>act(cur).filter(i=>i.shift===sh&&i.lantai===l&&i.id!==ex).length;
const penuh=(sh,l,ex)=>sh!=='CITO'&&jml(sh,l,ex)>=lim(sh,l);
const msgPenuh=(sh,l)=>'Lantai '+l+' shift '+sh+' sudah penuh (maks '+lim(sh,l)+' pasien)';

function stfBar(s){const o=stf(cur,s);

const st=l=>{const n=jml(s,l),m=lim(s,l),f=n>=m;return `<span style="${f?'color:#c00;font-weight:600':''}">Lt.${l}: ${n}/${m} · ${n>m?'⚠ melebihi':f?'PENUH':'sisa '+(m-n)}</span>`};
return `<div class="sb"><div class="r3">${inp('p1','Perawat Lt.1')}${inp('m1','Maks pasien Lt.1','40')}${inp('p2','Perawat Lt.2')}${inp('m2','Maks pasien Lt.2','40')}<div class="tt"><span>Total perawat</span><b>${(o.p1||0)+(o.p2||0)}</b></div></div>${st(1)} &nbsp;|&nbsp; ${st(2)}</div>`}
const fj=j=>j?String(j).replace(':','.'):'',sj=j=>j.shift==='CITO'?'CITO'+(j.jam?' '+fj(j.jam):''):j.shift;
const urut=a=>[...a].sort((x,y)=>{const rx=x.jenis==='Tambahan'?1:0,ry=y.jenis==='Tambahan'?1:0;return rx!==ry?rx-ry:rx?(x.jam&&y.jam?String(x.jam).localeCompare(String(y.jam)):0):x.nama.localeCompare(y.nama,'id',{sensitivity:'base'})});
const kc=k=>{k=k||'';return !k?'':/HCV/i.test(k)?'k-hcv':/HBS|HEP/i.test(k)?'k-hep':/ISO|\bTB\b/i.test(k)?'k-iso':/NON\s*REG/i.test(k)?'k-nr':'k-o'};
const CAP={1:{t:40,iso:[{n:'HBsAg',i:3,re:/HBS|HEP/i},{n:'HCV',i:2,re:/HCV/i}]},2:{t:40,iso:[{n:'HCV',i:2,re:/HCV/i},{n:'ISO TB',i:1,re:/ISO|\bTB\b/i}]}};let RS='Pagi';
let SIDE;try{const v=localStorage.getItem('hd_side');SIDE=v===null?innerWidth>=700:v==='1'}catch(e){SIDE=innerWidth>=700}

return `<div><div class="lh l${l}">Lantai ${l}<span style="${bad?'color:#c00':''}">${bad?'⚠ ':''}${sh==='CITO'?n+' pasien':n+'/'+lim(sh,l)}</span></div>${sh==='CITO'?'':`<small>Reguler ${z.reg}/${z.rt} · ${z.r.map(x=>x.n+' '+x.u+'/'+x.i).join(' · ')}</small>`}${bad?`<small style="color:#c00">${ot?'Ada pasien HBsAg/ISO TB di lantai yang tidak punya ruang isolasinya. ':''}Periksa kapasitas: reguler maks ${z.rt}, isolasi melebihi batas di atas.</small>`:''}<table>${it.map((i,x)=>`<tr class="${i.status==='Batal'?'bt':''} r-${i.asal}"><td>${x+1}</td><td>${esc(i.nama)}${i.jenis==='Tambahan'?' <b class="tb">+</b>':''}<small>${esc(i.rm)} · ${esc(i.asal)}${i.jam?' · 🕐 '+fj(i.jam):''}</small></td><td>${i.ket?`<span class="k ${kc(i.ket)}">${esc(i.ket)}</span>`:''}</td><td class="np"><button onclick="ed('${i.id}')">✎</button> <button onclick="bt('${i.id}')">${i.status==='Batal'?'↺':'⊘'}</button> <button onclick="del('${i.id}')">🗑</button></td></tr>`).join('')||'<tr><td class="mut">Kosong</td></tr>'}</table></div>`}
function vHarian(){const d=J(cur);
return `<div class="bar np"><button class="pri" onclick="tarik()">⤓ Tarik jadwal rutin</button><button onclick="tambah()">＋ Tambah pasien</button><button onclick="cekForm()">🔍 Cek riwayat HD</button><button onclick="rilis()">✔ Tandai dirilis</button><button onclick="go('rilis')">🖨 Lihat/cetak rilis</button><button onclick="toggleSide()">${SIDE?'⇅ Bertumpuk':'⇄ Berdampingan'}</button><span class="mut">${d.rilis?'Dirilis '+new Date(d.rilis).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'Draf (tersimpan otomatis)'}</span></div>
<div class="ph"><b>JADWAL HEMODIALISA — ${tgl(cur).toUpperCase()}</b><br>Instalasi Hemodialisa RSUD Welas Asih</div>
${['Pagi','Siang'].map(s=>`<div class="card"><h3>Shift ${s}</h3>${stfBar(s)}<div class="grid${SIDE?' side':''}">${blok(s,1)}${blok(s,2)}</div></div>`).join('')}${J(cur).items.some(i=>i.shift==='CITO')?`<div class="card"><h3>CITO · layanan 24 jam</h3><div class="grid${SIDE?' side':''}">${blok('CITO',1)}${blok('CITO',2)}</div></div>`:''}`}
function tarik(){const wd=pd(cur).getDay(),day=J(cur);let n=0;
S.master.filter(m=>m.aktif!==false&&m.hari.includes(wd)).forEach(m=>{if(!day.items.some(i=>i.mid===m.id)){day.items.push({id:uid(),mid:m.id,nama:m.nama,rm:m.rm,asal:m.asal,shift:mSh(m,wd),lantai:m.lantai,ket:m.ket,jenis:'Rutin',status:'Aktif'});n++}});
day.rilis=null;save();render();const ov=[];['Pagi','Siang'].forEach(x=>[1,2].forEach(l=>{if(jml(x,l)>lim(x,l))ov.push(x+' Lt.'+l)}));toast(n+' pasien rutin ditarik'+(ov.length?'. ⚠ Melebihi batas: '+ov.join(', '):''))}
const fi=id=>J(cur).items.find(i=>i.id===id);
function bt(id){const i=fi(id);if(i.status==='Batal'&&penuh(i.shift,i.lantai)){toast(msgPenuh(i.shift,i.lantai));return}i.status=i.status==='Batal'?'Aktif':'Batal';J(cur).rilis=null;save();render()}
function del(id){const d=J(cur);d.items=d.items.filter(i=>i.id!==id);d.rilis=null;save();render()}

/* ---- Gambar rilis satu halaman (tidak terpotong, untuk dibagikan ke WA) ---- */
function rilisCanvas(mk){
const W=1080,P=24,G=16,CW=(W-2*P-G)/2,F='"Segoe UI",Roboto,Arial,sans-serif',cito=RS==='CITO';
const KB={'k-hep':'#f08a8a','k-hcv':'#f5a3cf','k-iso':'#8fd8ee','k-nr':'#9be39b','k-o':'#e6e9ee'},RC={Ranap:'#ffe3c4',IGD:'#e0d4f8'};
const cols=[1,2].map(l=>{const it=urut(act(cur).filter(i=>i.shift===RS&&i.lantai===l)),c=CAP[l],z=cnt(it,l);
return{l,it,ft:'Terisi '+it.length+(cito?' pasien CITO':'/'+c.t+' · Reguler '+z.reg+'/'+z.rt+' · '+z.r.map(x=>x.n+' '+x.u+'/'+x.i).join(' · '))}});
const o=cito?{}:stf(cur,RS),jaga=(o.p1||o.p2)?'Perawat jaga: Lt.1 = '+(o.p1||0)+' · Lt.2 = '+(o.p2||0)+' · Total '+((o.p1||0)+(o.p2||0)):'';
const hd=[[cito?'JADWAL HEMODIALISA — CITO (24 JAM)':'JADWAL HEMODIALISA — SHIFT '+RS.toUpperCase(),'bold 30px',34],
[cito?'Layanan 24 jam · sesuai indikasi':'Pukul '+(RS==='Pagi'?'06.00':'12.15')+' WIB','bold 24px',32],
[tgl(cur),'24px',32],['Instalasi Hemodialisa RSUD Welas Asih','20px',28]];
if(jaga)hd.push([jaga,'20px',28]);
const n=Math.max(1,cols[0].it.length,cols[1].it.length);
const FIX=P+hd.reduce((s,h)=>s+h[2],0)+10+40+38+36+50+30+P;
/* makin banyak pasien, baris makin rapat (tetap 1 gambar, rasio layar HP); minimal 30px agar terbaca */
const RH=Math.max(30,Math.min(46,Math.floor((2300-FIX)/n))),FS=Math.max(14,Math.min(21,Math.round(RH*.46))),SH=RH>=38;
const H=FIX+n*RH,S=Math.min(2,4000/H);
const c=mk?mk():document.createElement('canvas');c.width=Math.round(W*S);c.height=Math.round(H*S);
const x=c.getContext('2d');x.scale(S,S);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textBaseline='middle';
const fit=(s,w,px,b)=>{s=String(s==null?'':s);let z=px;const f=()=>x.font=(b?'bold ':'')+z+'px '+F;f();while(z>13&&x.measureText(s).width>w){z--;f()}
if(x.measureText(s).width>w){while(s.length>1&&x.measureText(s+'…').width>w)s=s.slice(0,-1);s+='…'}return s};
const rr=(px,py,w,h,r,fill)=>{x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();x.fillStyle=fill;x.fill()};
let y=P;x.textAlign='center';
hd.forEach((h,i)=>{x.font=h[1]+' '+F;x.fillStyle=i>2?'#555':'#1b2430';x.fillText(h[0],W/2,y+h[2]/2);y+=h[2]});
y+=10;const y0=y;
cols.forEach((col,ci)=>{const X=P+ci*(CW+G);let yy=y0;
x.fillStyle=col.l===1?'#cfe8c9':'#cfdcf5';x.fillRect(X,yy,CW,40);x.fillStyle='#1b2430';x.textAlign='center';x.font='bold 22px '+F;x.fillText('LANTAI '+col.l,X+CW/2,yy+20);yy+=40;
const wN=44,wK=110,wR=118,wJ=cito?72:0,wNm=CW-wN-wK-wR-wJ;
x.fillStyle='#3f7d62';x.fillRect(X,yy,CW,38);x.fillStyle='#fff';x.font='bold 18px '+F;
let cx=X;x.fillText('NO',cx+wN/2,yy+19);cx+=wN;x.fillText('NAMA',cx+wNm/2,yy+19);cx+=wNm;
if(cito){x.fillText('JAM',cx+wJ/2,yy+19);cx+=wJ}x.fillText('RM',cx+wR/2,yy+19);cx+=wR;x.fillText('Ket',cx+wK/2,yy+19);yy+=38;
col.it.forEach((i,k)=>{const ry=yy+k*RH,bg=RC[i.asal];if(bg){x.fillStyle=bg;x.fillRect(X,ry,CW,RH)}
x.strokeStyle='#c9d1da';x.lineWidth=1;x.beginPath();x.moveTo(X,ry+RH-.5);x.lineTo(X+CW,ry+RH-.5);x.stroke();
x.fillStyle='#1b2430';let px=X;x.textAlign='center';x.font=FS+'px '+F;x.fillText(k+1,px+wN/2,ry+RH/2);px+=wN;
const lab=(!SH||i.asal==='Rajal'||!i.asal)?'':String(i.asal).toUpperCase();
x.textAlign='left';x.fillStyle='#1b2430';const nm=fit(i.nama,wNm-8,FS+1,false);x.fillText(nm,px+4,ry+RH/2-(lab?7:0));
if(lab){x.font='bold 12px '+F;x.fillStyle='#666';x.fillText(lab,px+4,ry+RH/2+12)}px+=wNm;
x.textAlign='center';x.fillStyle='#1b2430';
if(cito){x.font=FS+'px '+F;x.fillText(fj(i.jam),px+wJ/2,ry+RH/2);px+=wJ}
x.font=FS+'px '+F;x.fillText(fit(i.rm,wR-6,FS,false),px+wR/2,ry+RH/2);px+=wR;
if(i.ket){const t=fit(i.ket,wK-26,Math.max(12,FS-4),true),w=Math.min(wK-10,x.measureText(t).width+16),bh=Math.round(RH*.62);rr(px+(wK-w)/2,ry+RH/2-bh/2,w,bh,6,KB[kc(i.ket)]||KB['k-o']);x.fillStyle='#1b2430';x.fillText(t,px+wK/2,ry+RH/2+1)}});
if(!col.it.length){x.fillStyle='#888';x.font='italic 18px '+F;x.textAlign='center';x.fillText('— belum ada pasien —',X+CW/2,yy+RH/2)}
x.strokeStyle='#c9d1da';x.strokeRect(X+.5,y0+.5,CW-1,40+38+n*RH-1);
x.fillStyle='#555';x.textAlign='center';x.fillText(fit(col.ft,CW-8,17,false),X+CW/2,y0+40+38+n*RH+18)});

return `<div class="card" style="margin-top:8px">${nama?'<b>'+esc(nama)+'</b><br>':''}HD terakhir: <b>${tg2(last)}</b>${src==='manual'?' <small style="display:inline">(dicatat manual)</small>':''}<div style="font-size:20px;font-weight:700;${tl?'color:#c00':''}">${hr}</div>${tl?'<small style="color:#c00">⚠ Sudah ≥ '+TELAT+' hari sejak HD terakhir</small>':''}
${hits.length?`<small>Riwayat terakhir: ${hits.slice(0,5).map(h=>tg2(h.d).replace(/ \d{4}$/,'')+' ('+h.i.shift+' L'+h.i.lantai+')').join(' · ')}</small>`:''}${tetap}

async function pTarik(id){const p=PEND.find(x=>x.id===id),tg=gv('t_tgl'),sh=gv('t_sh'),lt=+gv('t_lt'),jam=sh==='CITO'?gv('t_jam'):'';if(!tg||!sh){toast('Pilih tanggal dan shift');return}

const o=cur;cur=tg;mon=cur.slice(0,7);const day=J(cur),ex=day.items.find(i=>i.pid===id),back=()=>{cur=o;mon=cur.slice(0,7)};

if(ex){ex.status='Aktif';ex.shift=sh;ex.lantai=lt;ex.jam=jam;ex.ket=ketOf(p)}else day.items.push({id:uid(),pid:id,nama:p.nama,rm:p.rm,asal:'Ranap',shift:sh,lantai:lt,jam:jam,ket:ketOf(p),jenis:'Tambahan',status:'Aktif'});
day.rilis=null;save();$('#dlg').close();V='harian';render();toast('Ditarik ke jadwal '+tgl(tg)+' · '+(sh==='CITO'?'CITO jam '+fj(jam):sh)+' Lt.'+lt)}
